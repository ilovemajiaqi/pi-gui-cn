name: Claude

# Runs Claude when someone mentions @claude in a PR or issue comment/review.
# Auth: CLAUDE_CODE_OAUTH_TOKEN (Claude subscription, from `claude setup-token`).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Read-only by default; the single job below asks for the writes it actually needs.
permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Claude commits to a branch and comments on the PR or issue it was asked
      # about, so those three writes are load-bearing. id-token: write is what
      # lets the action fetch its OIDC token; the GitHub App auth path requires it.
      # actions: read was listed here but nothing asked for workflow logs (no
      # additional_permissions input), so it was removed rather than left as a
      # permission nobody would notice being wrong.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # Optional in forks: skip cleanly instead of failing when the token is absent.
      - name: Check whether Claude is configured
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN is not configured; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        if: steps.gate.outputs.enabled == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
