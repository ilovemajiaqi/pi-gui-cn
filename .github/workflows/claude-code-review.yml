name: Claude Code Review

# Reviews each same-repo PR once when it is opened or marked ready, using the official
# code-review plugin and the repo's AGENTS.md/CLAUDE.md guidance.
# Auth: CLAUDE_CODE_OAUTH_TOKEN (Claude subscription, from `claude setup-token`).
# Ask for a fresh review later with an `@claude` comment (see claude.yml).

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, and must never get the subscription token.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # The upstream token is optional in forks. Without it the action fails
      # before doing anything, so detect it once and skip the review cleanly.
      - name: Check whether Claude review is configured
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN is not configured; skipping Claude review." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 1

      - id: claude
        if: steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
          # The plugin's own allowed-tools list is not applied in CI; grant it here
          # so it can read the PR, launch its review agents, and comment inline.
          # Background agents end a non-interactive run early, so keep them in the foreground.
          claude_args: |
            --append-system-prompt "This is a non-interactive CI run: ending your turn ends the run. Launch every Agent with run_in_background set to false and wait for its result before continuing. Never end your turn while waiting on an agent. Before each inline comment, Read the file and confirm the exact line number; a suggestion block replaces exactly the commented lines."
            --allowedTools "Agent,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"

      # The action hides Claude's output. Log only the commands Claude ran and its
      # final message (not tool results) so a skipped or empty review is explainable.
      - name: Log review outcome
        if: always() && steps.gate.outputs.enabled == 'true' && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | "tool: \(.name) \(.input | tostring | .[0:300])"' "$EXECUTION_FILE"
          jq -r '.[] | select(.type == "result") | "result: \(.result // "")"' "$EXECUTION_FILE"
