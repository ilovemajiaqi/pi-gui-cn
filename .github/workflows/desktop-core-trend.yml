name: Desktop Core Trend

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-core-trend
  cancel-in-progress: false

jobs:
  desktop-core-trend:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run desktop core once
        env:
          PI_APP_TEST_MODE: background
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/apps/desktop/test-results/desktop-core-trend.json
        run: >-
          pnpm --filter @pi-gui/desktop run test:e2e:core
          --workers=1
          --retries=0
          --reporter=line,json

      - name: Group trend results by spec
        if: always()
        run: >-
          node .github/scripts/summarize-playwright-trend.mjs
          apps/desktop/test-results/desktop-core-trend.json
          apps/desktop/test-results/desktop-core-trend-summary.json

      - name: Upload desktop core trend artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-core-trend-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/test-results/
          retention-days: 30
          if-no-files-found: error
