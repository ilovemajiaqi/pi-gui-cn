name: ✨ 功能建议
description: 提出新功能、改进建议或本地化需求
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！请先搜索[现有 Issue](https://github.com/ilovemajiaqi/pi-gui-cn/issues) 与 [Discussions](https://github.com/ilovemajiaqi/pi-gui-cn/discussions)，确认没有相同建议。
        如果建议涉及上游原有功能，请同时说明是否已向上游提出。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 与 Discussions，确认这不是重复建议
          required: true
        - label: 这不是安全漏洞（安全漏洞请走私密报告渠道）
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景与痛点，而不只是功能名称
      placeholder: 当我……时，我希望……，因为……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望应用如何表现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 目前你用什么方式绕过这个问题？

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 国际化 / 文案 / 术语
        - 界面与交互
        - 会话与时间线
        - 终端 / 文件 / 工作树
        - 扩展与技能
        - 设置与可访问性
        - 性能与稳定性
        - 文档与开发体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 参考截图、上游相关 Issue、设计草图等

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个建议
        - label: 我可以协助测试或翻译
